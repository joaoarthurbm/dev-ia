<article>

    {{ if not .Params.notitle }}
    <h1>{{ .Title }}</h1>
    {{ end }}

    {{ if not .Params.meta }}
        {{ partial "aside" . }}
    {{ end }}

    {{ if and (eq .Section "posts") .TableOfContents }}
    <details id="toc">
        <summary>Tópicos</summary>
        {{ .TableOfContents }}
    </details>
    {{ end }}

    {{.Content}}

</article>
